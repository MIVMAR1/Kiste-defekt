<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Kiste defekt melden</title>

    <!-- DataMatrix / QR Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <!-- Excel Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: auto;
        }
        #reader {
            width: 100%;
            margin-top: 20px;
        }
        input, textarea, button {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            font-size: 16px;
        }
        button {
            cursor: pointer;
        }
    </style>
</head>
<body>

<h2>📦 Kiste als kaputt melden</h2>

<div id="reader"></div>

<input type="text" id="code" placeholder="DataMatrix Code" readonly>

<textarea id="reason" placeholder="Grund warum die Kiste kaputt ist"></textarea>

<button onclick="saveEntry()">💾 In Excel speichern</button>

<script>
    let entries = [];

    const html5QrCode = new Html5Qrcode("reader");

    html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        (decodedText) => {
            document.getElementById("code").value = decodedText;
        }
    );

    function saveEntry() {
        const code = document.getElementById("code").value;
        const reason = document.getElementById("reason").value;

        if (!code || !reason) {
            alert("Bitte Code scannen und Grund eingeben.");
            return;
        }

        const now = new Date().toLocaleString();

        entries.push({
            Datum: now,
            DataMatrix: code,
            Grund: reason
        });

        const worksheet = XLSX.utils.json_to_sheet(entries);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Defekte_Kisten");

        XLSX.writeFile(workbook, "defekte_kisten.xlsx");

        document.getElementById("reason").value = "";
        alert("Gespeichert!");
    }
</script>

</body>
</html>
